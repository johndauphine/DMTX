# Offline verification only.
#
# This workflow does NOT prove Stage 4 semantics. It runs the suite with no
# database endpoints configured, so every live test skips and the suite still
# reports success. That is by design for a hosted runner, but it means a green
# check here says: it compiles, offline tests pass, vet is clean, there are no
# data races, and it cross-builds.
#
# The Stage 4 claim rests on the armed gate, which must currently be run
# locally:
#
#   DMTX_STAGE4_LIVE_REQUIRED=1 go test ./... -count=1
#   DMTX_STAGE4_LIVE_REQUIRED=1 go test -race ./... -count=1
#
# DMTX_STAGE4_LIVE_REQUIRED=1 turns an absent endpoint from a silent skip into
# a failure. Without it a missing fixture is indistinguishable from a passing
# test. See docs/STAGE4_CLOSEOUT_HANDOFF.md for the 16-variable environment.
#
# The `live` job below runs the armed gate against real containers built from
# test/fixtures. This `test` job stays offline and fast so ordinary pushes are
# not gated on a fifteen-minute database matrix.

name: Verify

on:
  # pull_request only, plus pushes to main. This used to be `push` and
  # `pull_request` with no filter, which ran the whole workflow TWICE for every
  # commit on a branch with an open PR - once for each event, on the same SHA,
  # producing identical results. The armed gate takes about fifteen minutes, so
  # that was thirty minutes of runner time per push for fifteen minutes of
  # information.
  pull_request:
  push:
    branches: [main]
  # Nightly, for the checks that are too expensive to gate a PR on but must not
  # go unrun. workflow_dispatch so they can be demanded on request.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Supersede a run when its branch moves. Without this, pushing three times in
# five minutes leaves three full gates running against commits nobody is waiting
# on any more, and the newest one queues behind them.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run offline tests (live endpoints absent, live tests skip)
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Detect unused code
        # go vet does not report unreachable declarations. This gate exists
        # because an unwired safety check hid that way; see .golangci.yml for
        # why the configuration is deliberately narrow.
        # v7 is required: the action gained golangci-lint v2 support there.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Detect data races
        run: go test -race ./...

      - name: Build Linux command
        run: go build -o dmtx ./cmd/dmtx

      - name: Build Windows command
        run: GOOS=windows GOARCH=amd64 go build -o dmtx.exe ./cmd/dmtx

      - name: Record what this run did not cover
        if: always()
        run: |
          {
            echo "### Offline verification only"
            echo
            echo "This job had no database endpoints, so every live test skipped."
            echo "It proves compilation, offline tests, vet, race, and cross-build."
            echo
            echo "Stage 4 semantics are proven by the **live** job in this same"
            echo "workflow, which runs the armed gate against real containers."
          } >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Armed live gate
    runs-on: ubuntu-latest
    # Longer than the observed runtime by a wide margin: a hang here should end
    # as a failure rather than burn the job limit.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate fixture TLS material
        working-directory: test/fixtures
        run: ./generate-certs.sh

      - name: Start database fixtures
        working-directory: test/fixtures
        run: docker compose up -d

      - name: Wait for fixtures to report healthy
        working-directory: test/fixtures
        run: |
          for _ in $(seq 1 120); do
            healthy=$(docker ps --filter 'name=dmtx-' --filter 'health=healthy' --quiet | wc -l)
            if [ "$healthy" -eq 5 ]; then
              echo "all five fixtures healthy"
              exit 0
            fi
            sleep 5
          done
          echo "fixtures did not become healthy:"
          docker ps -a --filter 'name=dmtx-' --format '{{.Names}}\t{{.Status}}'
          docker compose logs --tail 50
          exit 1

      - name: Provision databases and grants
        working-directory: test/fixtures
        run: ./provision.sh

      # DMTX_STAGE4_LIVE_REQUIRED=1 is the point of this job. Without it a
      # missing endpoint would skip and the run would still report success,
      # which is the failure mode the whole gate exists to prevent.
      - name: Run armed live tests
        run: |
          source test/fixtures/env.sh
          DMTX_STAGE4_LIVE_REQUIRED=1 go test ./... -count=1 -timeout 30m

      # The armed race run moved to the nightly schedule. It is the expensive
      # half of this job - the same live suite a second time, with the race
      # detector's slowdown on top - and it re-runs everything the pass above
      # just ran. The offline race run in the `test` job still gates every PR,
      # so a data race in ordinary code is still caught here; what waits until
      # tonight is a race that only appears against a live endpoint.
      #
      # This is the trade the budget forced and the one worth making anyway: a
      # gate nobody can afford to run is not a gate.
      - name: Run armed live tests with the race detector
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          source test/fixtures/env.sh
          # 30m, not Go's 10m default. The race run of internal/migrate takes
          # roughly five minutes on a developer machine and far longer on a
          # four-core runner, so the default sat close enough to the limit that
          # the job passed or timed out depending on runner load.
          DMTX_STAGE4_LIVE_REQUIRED=1 go test -race ./... -count=1 -timeout 30m

      - name: Record what this run did not cover
        if: always()
        run: |
          {
            if [ "${{ github.event_name }}" = "schedule" ] || \
               [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "### Armed live gate, full"
              echo
              echo "Live tests ran with and without the race detector."
            else
              echo "### Armed live gate, pull-request scope"
              echo
              echo "Live tests ran once. The **armed race run did not**, and is"
              echo "on the nightly schedule instead."
              echo
              echo "So a data race that only appears against a live endpoint is"
              echo "not caught by this run. The offline race run in the \`test\`"
              echo "job did run, and covers a race in ordinary code."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect fixture logs on failure
        if: failure()
        working-directory: test/fixtures
        run: docker compose logs --tail 200

      - name: Stop fixtures
        if: always()
        working-directory: test/fixtures
        run: docker compose down -v
