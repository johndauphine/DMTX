name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Detect data races
        run: go test -race ./...

      - name: Build Linux command
        run: go build -o dmtx ./cmd/dmtx

      - name: Build Windows command
        run: GOOS=windows GOARCH=amd64 go build -o dmtx.exe ./cmd/dmtx
